[project]
name = "glb2pbr"
version = "0.1.0"
description = "Unwrap a textured glTF/GLB into Principled BSDF / Substance Designer PBR maps"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.0", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
glb2pbr = "glb2pbr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glb2pbr*"]
